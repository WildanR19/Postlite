[package]
name = "postlite"
version = "0.2.0"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "charset", "http2", "gzip", "brotli", "multipart", "cookies"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
keyring = "4.2.0"
aes-gcm = "0.11.1"
rand = "0.10.3"
cookie_store = "0.22.1"
url = "2.5.8"
rfd = { version = "0.17", default-features = false, features = ["gtk3"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
